/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

 img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>01 午夜放映厅 — AdPilot\u003c/title>\n\u003cstyle>\n  /* ═══ 方向 01 · 午夜放映厅 ═══\n     北极星：像在暗房放映室里审片——环境全黑，只有画面亮着，一条琥珀审片灯。\n     引擎：材质×环境 = 35mm 放映室；骨架：画面即界面（成片大画面即首屏主角） */\n  :root {\n    --ink: #0b0908;        /* 暖黑环境 */\n    --ink-2: #141110;      /* 面板 */\n    --line: #2a2320;       /* 暖色分隔线 */\n    --paper: #ede6d8;      /* 米白文字 */\n    --dim: #8a7f70;        /* 次级文字 */\n    --amber: #e8a33d;      /* 审片灯·唯一强调色 */\n    --amber-dim: rgba(232,163,61,.14);\n    --serif: \"Songti SC\", \"Noto Serif SC\", \"STSong\", serif;\n    --sans: \"PingFang SC\", \"Helvetica Neue\", sans-serif;\n    --mono: \"SF Mono\", Menlo, monospace;\n  }\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { background:var(--ink); color:var(--paper); font-family:var(--sans); height:100vh; overflow:hidden; }\n  .stage { display:grid; grid-template-rows:56px 1fr 208px; height:100vh; }\n\n  /* 顶栏：放映厅铭牌 */\n  header { display:flex; align-items:center; gap:20px; padding:0 28px; border-bottom:1px solid var(--line); }\n  .brand { font-family:var(--serif); font-size:19px; letter-spacing:.14em; }\n  .brand em { color:var(--amber); font-style:normal; }\n  .crumb { font-size:12px; color:var(--dim); letter-spacing:.06em; }\n  .lamp { margin-left:auto; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--amber); }\n  .lamp i { width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 12px 2px rgba(232,163,61,.55); animation:breath 2.4s ease-in-out infinite; }\n  @keyframes breath { 50% { opacity:.35; box-shadow:0 0 4px 0 rgba(232,163,61,.3);} }\n  .reel { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.12em; }\n\n  /* 主区：画面即界面 */\n  .hall { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:0; min-height:0; }\n  .screen { position:relative; display:flex; align-items:center; justify-content:center; gap:56px; padding:28px 40px; min-height:0; }\n  .screen::before { content:\"\"; position:absolute; inset:0; background:radial-gradient(ellipse 60% 70% at 38% 45%, rgba(232,163,61,.07), transparent 65%); pointer-events:none; }\n\n  /* 成片：竖版大画面，光从它来 */\n  .feature { position:relative; height:calc(100% - 24px); aspect-ratio:9/16; max-width:380px; box-shadow:0 0 90px rgba(232,163,61,.16), 0 30px 80px rgba(0,0,0,.7); }\n  .feature img { width:100%; height:100%; object-fit:cover; display:block; filter:brightness(1.04) saturate(1.05); }\n  .feature .frame { position:absolute; inset:0; border:1px solid rgba(237,230,216,.16); pointer-events:none; }\n  .feature .frame::before, .feature .frame::after,\n  .feature .frame i::before, .feature .frame i::after {\n    content:\"\"; position:absolute; width:14px; height:14px; border:1px solid var(--amber); \n  }\n  .feature .frame::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }\n  .feature .frame::after { top:-1px; right:-1px; border-left:0; border-bottom:0; }\n  .feature .frame i::before { bottom:-1px; left:-1px; border-right:0; border-top:0; }\n  .feature .frame i::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }\n  .feature .tc { position:absolute; left:12px; bottom:10px; font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:rgba(237,230,216,.75); text-shadow:0 1px 4px #000; }\n  .feature .grade { position:absolute; right:12px; top:10px; font-family:var(--mono); font-size:11px; background:rgba(11,9,8,.72); border:1px solid var(--amber); color:var(--amber); padding:3px 9px; letter-spacing:.1em; }\n\n  /* 片名信息区（压在画面旁的安全区） */\n  .titleblock { max-width:430px; }\n  .kicker { font-family:var(--mono); font-size:11px; letter-spacing:.34em; color:var(--amber); margin-bottom:18px; }\n  h1 { font-family:var(--serif); font-weight:900; font-size:52px; line-height:1.14; letter-spacing:.02em; margin-bottom:16px; }\n  .concept { font-family:var(--serif); font-size:15px; line-height:1.9; color:var(--dim); margin-bottom:26px; }\n  .concept b { color:var(--paper); font-weight:600; }\n  .meta { display:flex; gap:26px; font-size:12px; color:var(--dim); letter-spacing:.04em; margin-bottom:30px; }\n  .meta b { display:block; color:var(--paper); font-size:14px; font-weight:600; margin-top:4px; letter-spacing:.02em; }\n  .actions { display:flex; align-items:center; gap:16px; }\n  .btn-screen { font-family:var(--serif); font-size:15px; letter-spacing:.2em; color:var(--ink); background:var(--amber); border:0; padding:13px 34px; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; }\n  .btn-screen:hover { transform:translateY(-1px); box-shadow:0 6px 26px rgba(232,163,61,.4); }\n  .btn-ghost { font-size:12px; letter-spacing:.14em; color:var(--dim); background:none; border:1px solid var(--line); padding:12px 22px; cursor:pointer; transition:color .15s, border-color .15s; }\n  .btn-ghost:hover { color:var(--paper); border-color:var(--dim); }\n  .trace { margin-top:22px; font-size:11px; color:var(--dim); letter-spacing:.05em; line-height:1.9; }\n  .trace em { color:var(--amber); font-style:normal; }\n\n  /* 右栏：通告单（简报 + 智能体场记） */\n  .callroom { border-left:1px solid var(--line); background:var(--ink-2); padding:22px 22px 16px; overflow:hidden; display:flex; flex-direction:column; gap:18px; }\n  .sheet h3 { font-family:var(--mono); font-size:10px; letter-spacing:.3em; color:var(--dim); margin-bottom:12px; }\n  .sheet dl { display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12px; }\n  .sheet dt { color:var(--dim); letter-spacing:.08em; }\n  .sheet dd { color:var(--paper); }\n  .log { flex:1; min-height:0; border-top:1px solid var(--line); padding-top:14px; }\n  .log h3 { font-family:var(--mono); font-size:10px; letter-spacing:.3em; color:var(--dim); margin-bottom:12px; }\n  .log ul { list-style:none; display:flex; flex-direction:column; gap:9px; }\n  .log li { display:flex; gap:10px; font-size:11px; line-height:1.55; color:var(--dim); }\n  .log li b { color:var(--paper); font-weight:500; }\n  .log .t { font-family:var(--mono); font-size:10px; color:#5a5148; padding-top:1px; }\n  .log li.mark { border-left:2px solid var(--amber); padding-left:9px; margin-left:-11px; }\n  .log li.mark b { color:var(--amber); }\n\n  /* 底部：场景胶片条 */\n  .filmstrip { border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); }\n  .cell { position:relative; display:flex; gap:16px; padding:16px 22px; border-right:1px solid var(--line); align-items:center; transition:background .2s ease; cursor:pointer; }\n  .cell:last-child { border-right:0; }\n  .cell:hover { background:rgba(232,163,61,.05); }\n  /* 胶片齿孔 */\n  .cell::before { content:\"\"; position:absolute; top:0; left:0; right:0; height:7px;\n    background-image:radial-gradient(circle 2.6px at 9px 3.5px, var(--line) 98%, transparent); background-size:18px 7px; }\n  .cell .thumb { width:52px; height:86px; object-fit:cover; display:block; border:1px solid var(--line); filter:saturate(1.05); }\n  .cell .no { font-family:var(--serif); font-size:26px; color:var(--amber); line-height:1; }\n  .cell .info { min-width:0; }\n  .cell .info .role { font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:var(--dim); margin-bottom:5px; }\n  .cell .info .name { font-family:var(--serif); font-size:16px; margin-bottom:6px; }\n  .cell .info .sub { font-size:11px; color:var(--dim); letter-spacing:.03em; }\n  .cell .score { margin-left:auto; text-align:right; font-family:var(--mono); }\n  .cell .score b { font-size:24px; font-weight:600; color:var(--paper); display:block; line-height:1; }\n  .cell .score span { font-size:9px; letter-spacing:.24em; color:var(--amber); }\n  .cell.repaired .score b { color:var(--amber); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cspan class=\"brand\">Ad\u003cem>Pilot\u003c/em> 放映室\u0 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABBRoQAFAZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//2Q==\" alt=\"S3\">\n      \u003cspan class=\"no\">叁\u003c/span>\n      \u003cdiv class=\"info\">\n        \u003cp class=\"role\">CTA · 素材库\u003c/p>\n        \u003cp class=\"name\">号召 · 立即下载\u003c/p>\n        \u003cp class=\"sub\">5 秒 · 已通过\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"score\">\u003cb>82\u003c/b>\u003cspan>PASS\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/footer>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "01-cinema.html", "baseline": false, "interactive": false}, {"id": "mission-control", "name": "02 任务控制", "concept": "像在任务控制中心看一台精密机器自己运转：每个智能体是一台仪表，机器的每次判断都亮灯可见", "typography": "全局等宽字体 + 大数字仪表；字母间距拉大，信息按网格线对齐", "palette": ["#050a08", "#c6f24e", "#ff5c38"], "traits": ["网格拼贴、无圆角、1px 结构线", "智能体动态升为主舞台（打破时间线塞右栏的套路）", "酸绿=正常/通过，警示橙=修复事件"], "kind": "html", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>02 任务控制 — AdPilot\u003c/title>\n\u003cstyle>\n  /* ═══ 方向 02 · 任务控制 ═══\n     北极星：像在任务控制中心看一台精密机器自己运转——每个智能体是一台仪表，机器的判断全部可见。\n     引擎：角色原型 = 航天任务控制台；骨架：网格拼贴（打破后台三栏套路，智能体动态升为主舞台） */\n  :root {\n    --bg: #050a08;         /* 冷黑绿底 */\n    --panel: #081209;\n    --line: #16241a;       /* 结构网格线 */\n    --txt: #d9e6dc;\n    --dim: #5f7566;\n    --lime: #c6f24e;       /* 仪表指示·酸绿 */\n    --orange: #ff5c38;     /* 警示橙 */\n    --mono: \"SF Mono\", Menlo, Consolas, monospace;\n    --sans: \"PingFang SC\", \"Helvetica Neue\", sans-serif;\n  }\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { background:var(--bg); color:var(--txt); font-family:var(--mono); height:100vh; overflow:hidden; }\n  .grid { display:grid; grid-template-rows:52px 1fr 176px; height:100vh; }\n\n  /* 顶栏：任务代号条 */\n  header { display:flex; align-items:center; gap:0; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.08em; }\n  header .seg { padding:0 20px; height:52px; display:flex; align-items:center; gap:10px; border-right:1px solid var(--line); color:var(--dim); }\n  header .seg b { color:var(--txt); font-weight:600; }\n  .mission { color:var(--lime) !important; }\n  .tplus { margin-left:auto; border-right:0; color:var(--dim); }\n  .dot { width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 8px rgba(198,242,78,.8); animation:blink 1.6s steps(2) infinite; }\n  @keyframes blink { 50% { opacity:.25; } }\n\n  /* 主区：仪表拼贴 —— 中栏是主舞台（智能体动态），打破\"时间线塞右栏\"的套路 */\n  .deck { display:grid; grid-template-columns:280px minmax(0,1fr) 300px; min-height:0; }\n  .mod { border-right:1px solid var(--line); padding:18px; min-height:0; }\n  .mod:last-child { border-right:0; }\n  .mod h2 { font-size:10px; font-weight:500; letter-spacing:.34em; color:var(--dim); margin-bottom:14px; }\n  .mod h2 b { color:var(--txt); }\n\n  /* 左：简报参数 + 任务指标 */\n  .kv { display:flex; flex-direction:column; gap:9px; font-size:12px; }\n  .kv .row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--line); padding-bottom:8px; }\n  .kv .row span { color:var(--dim); }\n  .kv .row b { font-weight:500; text-align:right; }\n  .gauges { margin-top:20px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }\n  .gauge { border:1px solid var(--line); padding:12px 10px 10px; text-align:center; }\n  .gauge b { font-size:26px; font-weight:600; color:var(--lime); display:block; line-height:1; }\n  .gauge span { font-size:10px; color:var(--dim); letter-spacing:.14em; display:block; margin-top:7px; }\n  .gauge.warn b { color:var(--orange); }\n  .pipeline { margin-top:20px; }\n  .pipeline h3 { font-size:10px; letter-spacing:.3em; color:var(--dim); margin-bottom:10px; }\n  .stages { display:flex; gap:4px; }\n  .stages i { height:5px; flex:1; background:var(--line); }\n  .stages i.on { background:var(--lime); box-shadow:0 0 8px rgba(198,242,78,.5); }\n  .stages-label { display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin-top:7px; letter-spacing:.1em; }\n\n  /* 中：智能体动态 = 主舞台 */\n  .console { background:var(--panel); position:relative; overflow:hidden; }\n  .console::after { content:\"\"; position:absolute; inset:0; pointer-events:none;\n    background:repeating-linear-gradient(0deg, rgba(217,230,220,.022) 0 1px, transparent 1px 3px); }\n  .feed { display:flex; flex-direction:column; gap:0; font-size:12.5px; line-height:1.5; }\n  .ev { display:grid; grid-template-columns:58px 52px 1fr; gap:12px; padding:8px 18px 8px 0; border-bottom:1px solid var(--line); align-items:baseline; }\n  .ev .t { color:#42513f; font-size:11px; }\n  .ev .who { color:var(--dim); letter-spacing:.1em; font-size:11px; }\n  .ev .what { color:var(--txt); }\n  .ev .what small { display:block; color:var(--dim); font-size:11px; margin-top:2px; }\n  .ev.hot { background:linear-gradient(90deg, rgba(198,242,78,.08), transparent 70%); }\n  .ev.hot .who, .ev.hot .what b { color:var(--lime); }\n  .ev.alert { background:linear-gradient(90deg, rgba(255,92,56,.08), transparent 70%); }\n  .ev.alert .who, .ev.alert .what b { color:var(--orange); }\n  .agents { position:absolute; top:0; right:0; left:0; height:44px; border-bottom:1px solid var(--line); display:flex; background:var(--bg); }\n  .agents .a { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border-right:1px solid var(--line); font-size:11px; letter-spacing:.18em; color:var(--dim); }\n  .agents .a:last-child { border-right:0; }\n  .agents .a i { width:6px; height:6px; border-radius:50%; background:var(--line); }\n  .agents .a.on { color:var(--txt); }\n  .agents .a.on i { background:var(--lime); box-shadow:0 0 8px rgba(198,242,78,.7); }\n  .feedwrap { position:absolute; top:44px; bottom:0; left:0; right:0; overflow:hidden; padding-top:6px; }\n\n  /* 右：成片舱 */\n  .bay { display:flex; flex-direction:column; }\n  .bay .holder { position:relative; width:180px; margin:2px auto 16px; }\n  .bay img { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; border:1px solid var(--lime); box-shadow:0 0 34px rgba(198,242,78,.14); }\n  .bay .corner { position:absolute; inset:-5px; pointer-events:none; }\n  .bay .corner i { position:absolute; width:10px; height:10px; border:1px solid var(--lime); }\n  .bay .corner i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}\n  .bay .corner i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}\n  .bay .corner i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}\n  .bay .corner i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}\n  .dl { display:block; width:100%; text-align:center; background:var(--lime); color:#0a1206; font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.22em; padding:11px 0; border:0; cursor:pointer; transition:filter .15s; }\n  .dl:hover { filter:brightness(1.1); }\n  .baynote { margin-top:12px; font-size:11px; color:var(--dim); line-height:1.8; text-align:center; letter-spacing:.04em; }\n  .baynote b { color:var(--txt); font-weight:500; }\n\n  /* 底部：三场景状态条 */\n  .strip { border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); }\n  .sc { border-right:1px solid var(--line); padding:14px 20px; display:flex; gap:14px; align-items:center; }\n  .sc:last-child { border-right:0; }\n  .sc .id { font-size:22px; font-weight:600; color:var(--lime); }\n  .sc.warn .id { color:var(--orange); }\n  .sc 03c/div>\n      \u003cdiv class=\"meter\">\u003cb>82\u003c/b>\u003cdiv class=\"bar\">\u003ci style=\"width:82%\">\u003c/i>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sc warn\">\n      \u003cspan class=\"id\">S2\u003c/span>\n      \u003cdiv class=\"body\">\u003cp class=\"nm\">证明 · 连击狂欢 · 第 2 版\u003c/p>\u003cp class=\"src\">AI 生成 · 6 秒 · 修复 64→88\u003c/p>\u003c/div>\n      \u003cdiv class=\"meter\">\u003cb>88\u003c/b>\u003cdiv class=\"bar\">\u003ci style=\"width:88%\">\u003c/i>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sc\">\n      \u003cspan class=\"id\">S3\u003c/span>\n      \u003cdiv class=\"body\">\u003cp class=\"nm\">号召 · 立即下载\u003c/p>\u003cp class=\"src\">素材库 · 5 秒\u003c/p>\u003c/div>\n      \u003cdiv class=\"meter\">\u003cb>82\u003c/b>\u003cdiv class=\"bar\">\u003ci style=\"width:82%\">\u003c/i>\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/footer>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "02-mission-control.html", "baseline": false, "interactive": false}, {"id": "editorial-poster", "name": "03 创意评审刊", "concept": "像翻一本广告创意总监的提案刊：每个场景是一页排版大胆的海报，巨型编号与分数印章即导航（唯一的亮色方向——广告提案物料本就是纸面排版语言）", "typography": "超重黑体巨字刊头 64px + Georgia 衬线概念段；场景编号 96px 做主视觉", "palette": ["#f2efe7", "#141210", "#ff4d00"], "traits": ["通栏上下堆叠，粗规则线分版", "纸白底+墨黑+国际橙", "QA 分数做成斜盖的印章"], "kind": "html", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>03 创意评审刊 — AdPilot\u003c/title>\n\u003cstyle>\n  /* ═══ 方向 03 · 创意评审刊 ═══\n     北极星：像翻一本广告创意总监的提案刊——每个场景是一页排版大胆的海报，巨型编号与色块即导航。\n     引擎：设计运动 = 瑞士国际主义海报 × 广告提案刊（广告行业的提案物料本就是纸面排版语言，亮色有据）；\n     骨架：通栏上下堆叠（超大刊头横贯，场景海报横排其下——没有左右分栏，没有后台卡片） */\n  :root {\n    --paper: #f2efe7;      /* 纸白 */\n    --ink: #141210;        /* 墨黑 */\n    --orange: #ff4d00;     /* 国际橙·唯一强调 */\n    --grey: #8d8779;\n    --rule: #141210;\n    --display: \"PingFang SC\", \"Hiragino Sans GB\", sans-serif;  /* 超重黑体 */\n    --serif: \"Georgia\", \"Songti SC\", serif;\n  }\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { background:var(--paper); color:var(--ink); font-family:var(--display); height:100vh; overflow:hidden; }\n  .sheet { height:100vh; display:grid; grid-template-rows:auto 1fr auto; }\n\n  /* 刊头：通栏大字 */\n  header { border-bottom:3px solid var(--rule); padding:20px 36px 18px; display:grid; grid-template-columns:1fr auto; align-items:end; gap:24px; }\n  .masthead h1 { font-size:64px; font-weight:900; letter-spacing:.01em; line-height:.98; }\n  .masthead h1 span { color:var(--orange); }\n  .masthead .sub { margin-top:10px; font-size:13px; letter-spacing:.22em; color:var(--grey); }\n  .masthead .sub b { color:var(--ink); font-weight:700; }\n  .issue { text-align:right; font-family:var(--serif); }\n  .issue .no { font-size:15px; letter-spacing:.3em; }\n  .issue .big { font-size:44px; font-weight:700; line-height:1; margin-top:6px; }\n  .issue .verdict { display:inline-block; margin-top:10px; border:2px solid var(--orange); color:var(--orange); font-family:var(--display); font-weight:800; font-size:13px; letter-spacing:.3em; padding:6px 14px 6px 17px; transform:rotate(-3deg); }\n\n  /* 中区：场景海报横排 */\n  .spread { display:grid; grid-template-columns:340px repeat(3,1fr); min-height:0; }\n  .brief-col { border-right:3px solid var(--rule); padding:24px 26px; display:flex; flex-direction:column; }\n  .brief-col h2 { font-size:12px; font-weight:800; letter-spacing:.34em; color:var(--orange); margin-bottom:18px; }\n  .brief-col .brief-list { display:flex; flex-direction:column; gap:13px; font-size:13px; line-height:1.5; }\n  .brief-list .b { border-bottom:1px solid rgba(20,18,16,.18); padding-bottom:11px; }\n  .brief-list .b span { display:block; font-size:10px; letter-spacing:.26em; color:var(--grey); margin-bottom:4px; }\n  .brief-list .b b { font-weight:700; }\n  .concept { margin-top:auto; font-family:var(--serif); font-size:14.5px; line-height:1.85; }\n  .concept b { color:var(--orange); }\n\n  .poster { position:relative; border-right:1px solid rgba(20,18,16,.25); padding:20px 22px; display:flex; flex-direction:column; transition:background .2s ease; cursor:pointer; }\n  .poster:last-child { border-right:0; }\n  .poster:hover { background:rgba(255,77,0,.045); }\n  .poster .num { font-size:96px; font-weight:900; line-height:.82; letter-spacing:-.04em; }\n  .poster .num small { font-size:13px; font-weight:800; letter-spacing:.3em; display:block; margin-bottom:10px; color:var(--grey); }\n  .poster.hot .num { color:var(--orange); }\n  .poster figure { margin:16px 0 0; position:relative; }\n  .poster img { width:100%; aspect-ratio:9/14; object-fit:cover; display:block; filter:contrast(1.05) saturate(1.08); }\n  .poster .cap { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; gap:8px; }\n  .poster .cap .nm { font-size:16px; font-weight:800; }\n  .poster .cap .meta { font-size:10px; letter-spacing:.16em; color:var(--grey); text-align:right; line-height:1.7; }\n  /* 分数印章 */\n  .stamp { position:absolute; top:104px; right:16px; border:3px solid var(--orange); color:var(--orange); font-weight:900; font-size:22px; padding:8px 12px; letter-spacing:.06em; transform:rotate(7deg); background:rgba(242,239,231,.85); }\n  .stamp small { display:block; font-size:9px; letter-spacing:.3em; font-weight:800; }\n  .poster.hot .stamp { border-color:var(--ink); color:var(--ink); }\n\n  /* 底栏：制作轨迹通栏 */\n  footer { border-top:3px solid var(--rule); padding:16px 36px; display:flex; align-items:center; gap:36px; }\n  footer .deliver { font-size:15px; font-weight:900; letter-spacing:.06em; }\n  footer .deliver span { color:var(--orange); }\n  footer .stats { display:flex; gap:34px; font-size:11px; letter-spacing:.18em; color:var(--grey); }\n  footer .stats b { color:var(--ink); font-size:15px; font-weight:900; display:block; letter-spacing:0; margin-bottom:2px; }\n  footer .cta { margin-left:auto; background:var(--ink); color:var(--paper); font-size:14px; font-weight:800; letter-spacing:.24em; padding:14px 34px; border:0; cursor:pointer; transition:background .15s; }\n  footer .cta:hover { background:var(--orange); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"sheet\">\n  \u003cheader>\n    \u003cdiv class=\"masthead\">\n      \u003ch1>TILE BLITZ \u003cspan>狂欢式连击\u003c/span>\u003c/h1>\n      \u003cp class=\"sub\">ADPILOT 提案刊 · \u003cb>巴西市场\u003c/b> · TIKTOK 竖屏 · 15 秒 · 三幕叙事\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"issue\">\n      \u003cp class=\"no\">ISSUE · 成片交付\u003c/p>\n      \u003cp class=\"big\">No.01\u003c/p>\n      \u003cspan class=\"verdict\">已通过 · 交付\u003c/span>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"spread\">\n    \u003caside class=\"brief-col\">\n      \u003ch2>本期简报 BRIEF\u003c/h2>\n      \u003cdiv class=\"brief-list\">\n        \u003cdiv class=\"b\">\u003cspan>产品\u003c/span>\u003cb>Tile Blitz 消除手游\u003c/b>\u003c/div>\n        \u003cdiv class=\"b\">\u003cspan>市场 / 受众\u003c/span>\u003cb>巴西 · 18–34 岁休闲玩家\u003c/b>\u003c/div>\n        \u003cdiv class=\"b\">\u003cspan>画幅 / 时长\u003c/span>\u003cb>竖屏 9:16 · 15 秒\u003c/b>\u003c/div>\n        \u003cdiv class=\"b\">\u003cspan>创意要求\u003c/span>\u003cb>连击爽感 · 色彩鲜艳，契合巴西审美\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"concept\">创意概念：\u003cb>「一分钟狂欢挑战」\u003c/b>——把巴西日常的碎片小憩变成一场迷你狂欢，指尖每点一下，连击数字跳升、彩纸迸发。\u003c/p>\n    \u003c/aside>\n\n    \u003csection class=\"poster\">\n      \u003cp class=\"num\">\u003csmall>SCENE · 素材库\u003c/small>01\u003c/p>\n      \u003cfigure>\n        \u003cimg src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD//gAPTGF2YzYwLjMuMTAwAP/bAEMACAYGBwYHCAgICAgICQkJCgoKCQkJCQoKCgoKCgwMDAoKCgoKCgoMDAwMDQ4NDQ0MDQ4ODw8PEhIRERUVFRkZH//EANsAAQEBAQEBAQEBAAAAAAAAAAABAgUGBwQDCAEBAQEBAQE AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//2Q==\" alt=\"S3 画面\">\n        \u003cspan class=\"stamp\">82\u003csmall>分 · 通过\u003c/small>\u003c/span>\n      \u003c/figure>\n      \u003cdiv class=\"cap\">\n        \u003cspan class=\"nm\">号召 · 立即下载\u003c/span>\n        \u003cspan class=\"meta\">5 秒\u003cbr>CTA\u003c/span>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cfooter>\n    \u003cp class=\"deliver\">制作轨迹 —— 3 场景 · 2 次画面生成 · \u003cspan>1 次自修复（仅 S2，64 → 88 分）\u003c/span>\u003c/p>\n    \u003cdiv class=\"stats\">\n      \u003cspan>\u003cb>00:15\u003c/b>成片时长\u003c/span>\n      \u003cspan>\u003cb>9:16\u003c/b>画幅\u003c/span>\n      \u003cspan>\u003cb>中文\u003c/b>配音\u003c/span>\n    \u003c/div>\n    \u003cbutton class=\"cta\">下载成片 MP4 ↓\u003c/button>\n  \u003c/footer>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "03-editorial.html", "baseline": false, "interactive": false}, {"id": "aurora-pipeline", "name": "04 极光流水线", "concept": "像在一块发光的磨砂玻璃上，看创意沿一条极光管道流成一支广告——把机器的旅程画成光", "typography": "几何无衬线（Avenir/Futura 栈）+ 大字距小标题；层级靠字重与间距", "palette": ["#0d0c1a", "#8b7cff", "#4ed8c6"], "traits": ["居中单一物件：横贯流水线光带+流动光斑", "磨砂玻璃卡 backdrop-blur", "渐变只出现在流水线与主按钮上，其余安静"], "kind": "html", "content": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>04 极光流水线 — AdPilot\u003c/title>\n\u003cstyle>\n  /* ═══ 方向 04 · 极光流水线 ═══\n     北极星：像在一块发光的磨砂玻璃上，看创意沿一条极光管道流成一支广告——机器的旅程被画成光。\n     引擎：材质×环境 = 磨砂玻璃 × 极光暗流（渐变只允许出现在流水线光带上，是\"生产过程\"的化身）；\n     骨架：居中单一物件——首屏只有一条横贯的流水线，四站挂其上 */\n  :root {\n    --bg: #0d0c1a;         /* 深紫黑 */\n    --glass: rgba(255,255,255,.045);\n    --glass-line: rgba(233,231,245,.14);\n    --txt: #e9e7f5;\n    --dim: #918da8;\n    --violet: #8b7cff;\n    --aqua: #4ed8c6;\n    --peach: #ffb38a;\n    --sans: \"Avenir Next\", \"Futura\", \"PingFang SC\", \"Helvetica Neue\", sans-serif;\n  }\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { background:var(--bg); color:var(--txt); font-family:var(--sans); height:100vh; overflow:hidden; }\n  .space { height:100vh; display:grid; grid-template-rows:60px 1fr auto; position:relative; }\n  .space::before { content:\"\"; position:absolute; inset:0; pointer-events:none;\n    background:radial-gradient(ellipse 70% 45% at 50% 34%, rgba(139,124,255,.13), transparent 62%),\n               radial-gradient(ellipse 45% 35% at 78% 70%, rgba(78,216,198,.07), transparent 60%); }\n\n  header { display:flex; align-items:center; gap:22px; padding:0 32px; border-bottom:1px solid var(--glass-line); position:relative; }\n  .logo { font-weight:700; font-size:17px; letter-spacing:.04em; }\n  .logo em { font-style:normal; background:linear-gradient(90deg, var(--violet), var(--aqua)); -webkit-background-clip:text; background-clip:text; color:transparent; }\n  .crumb { font-size:12.5px; color:var(--dim); letter-spacing:.05em; }\n  .pill { margin-left:auto; display:flex; gap:10px; }\n  .pill span { font-size:11px; letter-spacing:.14em; color:var(--dim); border:1px solid var(--glass-line); border-radius:999px; padding:7px 16px; }\n  .pill span.on { color:#0d0c1a; font-weight:700; background:linear-gradient(90deg, var(--aqua), var(--violet)); border:0; }\n\n  /* 主区：一条极光流水线居中横贯 */\n  .flow { position:relative; display:flex; flex-direction:column; justify-content:center; padding:0 40px; min-height:0; }\n  .line { position:relative; height:4px; border-radius:4px; margin:96px 30px 0;\n    background:linear-gradient(90deg, var(--violet), var(--aqua) 55%, var(--peach));\n    box-shadow:0 0 34px rgba(139,124,255,.65), 0 0 90px rgba(78,216,198,.25); }\n  .line::after { content:\"\"; position:absolute; top:-2px; left:0; width:160px; height:8px; border-radius:8px;\n    background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);\n    animation:stream 3.2s ease-in-out infinite; }\n  @keyframes stream { 0% { left:-10%; opacity:0; } 12% { opacity:1; } 88% { opacity:1; } 100% { left:96%; opacity:0; } }\n\n  .stations { display:grid; grid-template-columns:0.9fr 1.25fr 1.25fr 0.9fr; gap:22px; margin:-14px 6px 0; position:relative; }\n  .station { background:var(--glass); border:1px solid var(--glass-line); border-radius:22px; padding:20px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); min-height:0; }\n  .station h3 { font-size:11px; font-weight:700; letter-spacing:.3em; color:var(--dim); margin-bottom:14px; }\n  .station h3 i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--glass-line); vertical-align:1px; }\n  .station.done h3 i { background:var(--aqua); box-shadow:0 0 10px rgba(78,216,198,.8); }\n  .station.hi h3 i { background:var(--violet); box-shadow:0 0 10px rgba(139,124,255,.8); }\n\n  .brief-rows { display:flex; flex-direction:column; gap:9px; font-size:12.5px; }\n  .brief-rows .r { display:flex; justify-content:space-between; gap:10px; }\n  .brief-rows .r span { color:var(--dim); }\n  .brief-rows .r b { font-weight:600; text-align:right; }\n\n  .scenes { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }\n  .scene { border-radius:14px; overflow:hidden; border:1px solid var(--glass-line); position:relative; transition:transform .25s ease, box-shadow .25s ease; cursor:pointer; }\n  .scene:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.45); }\n  .scene img { width:100%; aspect-ratio:9/13.5; object-fit:cover; display:block; }\n  .scene .tag { position:absolute; top:8px; left:8px; font-size:10px; font-weight:700; letter-spacing:.12em; background:rgba(13,12,26,.75); padding:4px 9px; border-radius:999px; backdrop-filter:blur(6px); }\n  .scene .fix { position:absolute; top:8px; right:8px; font-size:10px; font-weight:700; color:#0d0c1a; background:linear-gradient(90deg, var(--peach), var(--violet)); padding:4px 9px; border-radius:999px; }\n  .scene .below { display:flex; justify-content:space-between; align-items:baseline; padding:9px 10px 7px; font-size:10.5px; color:var(--dim); }\n  .scene .below b { color:var(--txt); font-size:12.5px; }\n\n  .review ul { list-style:none; display:flex; flex-direction:column; gap:10px; font-size:12px; line-height:1.55; }\n  .review li { display:flex; gap:9px; color:var(--dim); }\n  .review li b { color:var(--txt); font-weight:600; }\n  .review li .sc { margin-left:auto; font-weight:700; color:var(--aqua); }\n  .review li.fixed .sc { color:var(--peach); }\n  .review .verdict { margin-top:12px; font-size:11.5px; color:var(--dim); border-top:1px solid var(--glass-line); padding-top:11px; }\n  .review .verdict b { color:var(--txt); }\n\n  /* 成片站：光带的终点，物件被点亮 */\n  .out { text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }\n  .out .poster { width:132px; position:relative; }\n  .out .poster img { width:100%; aspect-ratio:9/16; object-fit:cover; border-radius:14px; display:block;\n    box-shadow:0 0 0 1px var(--glass-line), 0 0 44px rgba(255,179,138,.28), 0 18px 44px rgba(0,0,0,.5); }\n  .out .poster .halo { position:absolute; inset:-7px; border-radius:18px; border:1px solid rgba(255,179,138,.4); pointer-events:none; }\n  .out .dl { border:0; cursor:pointer; font-family:var(--sans); font-size:12.5px; font-weight:700; letter-spacing:.1em; color:#0d0c1a;\n    background:linear-gradient(90deg, var(--peach), var(--aqua)); border-radius:999px; padding:11px 26px; transition:transform .18s ease, box-shadow .18s ease; }\n  .out .dl:hover { transform:translateY(-1px); box-shadow:0 8px 26px rgba(255,179,138,.35); }\n  .out .meta { font-size:11px; color:var(--dim); line-height:1.8; letter-spacing:.04em; }\n  .out .meta b { color:var(--txt); }\n\n  footer { border-top:1px solid var(--glass-line); padding:14px 32px; display:flex; align-items:center; gap:20px; position:relative; }\n  footer p { font-size:12px; color:var(--dim); letter-spacing:.05em; }\n  footer p b { color:var(--txt); font-weight:600; }\n  footer .journey { margin-left:auto; font-size:11px; letter-spacing:.2em; color:var(--dim); }\n  footer .journey i { display:inline-block; width:56px; height:2px; border-radius:2px; margin:0 6px; vertical-align:3px;\n    background:linear-gradient(90deg, var(--violet), var(--aqua), var(--peach)); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"space\">\n  \u003cheader>\n    \u003cspan class=\"logo\">Ad\u003cem>Pilot\u003c/em>\u003c/span>\n    \u003cspan class=\"crumb\">Tile Blitz · 巴西 · TikTok 竖屏 15 秒\u003c/span>\n    \u003cdiv class=\"pill\">\u003cspan class=\"on\">已交付\u003c/span>\u003cspan>素材库\u003c/span>\u003cspan>新建广告\u003c/span>\u003c/div>\n  \u003c/header>\n\n  \u003csection class=\"flow\">\n    \u003cdiv class=\"line\">\u003c/div>\n    \u003cdiv class=\"stations\">\n      \u003cdiv class=\"station done\">\n        \u003ch3>\u003ci>\u003c/i>简报 · 已接收\u003c/h3>\n        \u003cdiv class=\"brief-rows\">\n          \u003cdiv class=\"r\">\u003cspan>产品\u003c/span>\u003cb>Tile Blitz   const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?'已选择':'已选择 · 复制'):(short?'选择':'选这个方向')));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?'再点一次，带上最新备注重新复制':'选择这个方向，并复制给 Agent';});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:'未选择方向';$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?'备注 ·':'备注';const s=$('#state');if(!stored){s.textContent='浏览器存储不可用：关闭页面后选择和备注不会保留。';s.dataset.warn='';}else{s.textContent='备注会和选择一起复制。改完备注，再点一次“已选择”重新复制。';delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let t=`${DATA.round?DATA.round+'：':''}选 ${no(c)} ${c.name}`;if(st.notes.trim())t+=`\n备注：${st.notes.trim()}`;return t;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,t){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?'已复制，粘贴给 Agent':'复制失败，请手动复制';n.querySelector('code').textContent=ok?t.replace(/\n/g,' · '):t;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
